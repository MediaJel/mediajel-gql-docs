repoUrl: 105618632367.dkr.ecr.us-east-1.amazonaws.com
tag: latest
httpEndpoint: gql-docs.dmp.mediajel.ninja
certificateArn: arn:aws:acm:us-east-1:105618632367:certificate/af54473c-845a-495b-ae6d-8cba77eb8b23
global:
  environment: STAGE
containerPort: 3000
cpuRequest: 0.5
cpuLimit: 0.5
memoryRequest: 1Gi
memoryLimit: 1Gi
environment: STAGING
instancegroup: big-nodes
nextPublicGqlEndpoint: https://graphql-dojo.dmp.mediajel.ninja/
# Assistant LLM. Empty llmBaseUrl falls back to OpenAI.
# Z.AI direct. Via OpenRouter instead, set llmProviderOrder to pin the host —
# unpinned, one model name is served by 25 hosts at different quantizations.
llmBaseUrl: https://api.z.ai/api/coding/paas/v4
llmModel: glm-5.3
llmProviderOrder: ""            # OpenRouter only; unused talking to Z.AI directly
llmPickerModel: "glm-5.3-flash"
llmApiKeySecretKey: LLM_API_KEY

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80
