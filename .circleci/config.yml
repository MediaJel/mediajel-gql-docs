version: 2.1

executors:
  docker-executor:
    docker:
      - image: cimg/node:20.11.0
    resource_class: medium
    working_directory: ~/gql-docs
orbs:
  aws-cli: circleci/aws-cli@4.0
  aws-ecr: circleci/aws-ecr@9.0.2

# ---------------------------------------------------------------------------
# Reusable commands
# ---------------------------------------------------------------------------
commands:
  install-yq:
    description: "Install yq YAML processor"
    steps:
      - run:
          name: Install yq
          command: |
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq

  clone-gitops-repo:
    description: "Clone k8s-infra GitOps repository at the target branch"
    parameters:
      branch:
        type: string
        default: "master"
    steps:
      - run:
          name: Clone GitOps Repository (<< parameters.branch >>)
          command: |
            git config --global user.email "circleci@mediajel.com"
            git config --global user.name "CircleCI Bot"
            git clone --branch << parameters.branch >> \
              https://${GITOPS_PAT}@github.com/MediaJel/k8s-infra.git

  commit-and-push:
    description: "Commit updated manifests and push to the target branch"
    parameters:
      app_name:
        type: string
      branch:
        type: string
        default: "master"
      commit_action:
        type: string
        default: "update image tag to"
    steps:
      - run:
          name: Commit and Push (<< parameters.branch >>)
          command: |
            cd k8s-infra
            git commit -m "chore(<< parameters.app_name >>): << parameters.commit_action >> ${CIRCLE_SHA1}

            Built by CircleCI build #${CIRCLE_BUILD_NUM}
            Commit: ${CIRCLE_SHA1}
            Branch: ${CIRCLE_BRANCH}
            Author: $(git log -1 --pretty=format:'%an <%ae>')"

            git push origin << parameters.branch >>

jobs:
  build:
    executor: docker-executor
    parameters:
      app_env:
        type: string
    steps:
      - checkout
      - setup_remote_docker:
            version: docker24
      - aws-ecr/build_and_push_image:
          account_id: ${AWS_ACCOUNT_ID}
          auth:
              - aws-cli/setup:
                region: ${AWS_ECR_REGION}
          repo_scan_on_push: true
          create_repo: false
          region: 'us-east-1'
          repo: gql-docs
          tag: $CIRCLE_SHA1
          platform: linux/amd64
          attach_workspace: true
          workspace_root: .
          dockerfile: ./Dockerfile
          extra_build_args: '--build-arg APP_ENV=<< parameters.app_env >> --build-arg AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID} --build-arg AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}'

  # ===========================================================================
  # Deploy Jobs
  # ===========================================================================
  # GitOps Deploy Job Worfklow
  deploy:
    parameters:
      app_name:
        type: string
      update_script:
        type: string
      target_branch:
        type: string
        default: "master"
      commit_action:
        type: string
        default: "update image tag to"
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - install-yq
      - clone-gitops-repo:
          branch: << parameters.target_branch >>
      - run:
          name: Update Manifests
          command: |
            cd k8s-infra
            << parameters.update_script >>
      - commit-and-push:
          app_name: << parameters.app_name >>
          branch: << parameters.target_branch >>
          commit_action: << parameters.commit_action >>
# ---------------------------------------------------------------------------
# Workflows
# ---------------------------------------------------------------------------
workflows:
  staging:
    jobs:
      # Build
      - build:
          name: build-staging
          app_env: dojo
          context: STAGING
          filters:
            branches:
              only: dojo
      - deploy:
          name: deploy-staging
          app_name: mediajel-gql-docs
          target_branch: staging
          update_script: |
            yq eval '.spec.values.tag = env(CIRCLE_SHA1)' -i \
              fluxcd/clusters/staging/apps/mediajel-gql-docs/mediajel-gql-docs.yaml
            git add fluxcd/clusters/staging/apps/mediajel-gql-docs/mediajel-gql-docs.yaml
          context: STAGING
          filters:
            branches:
              only: dojo
          requires: [build-staging]

  production:
    jobs:
      # Build
      - build:
          name: Build-Graphql-Docs-Production
          app_env: production
          context: PRODUCTION
          filters:
            branches:
              only: master
      # GitOps deploy → k8s-infra master
      - deploy:
          name: Deploy-Graphql-Docs-Production
          app_name: mediajel-gql-docs
          target_branch: master
          update_script: |
            yq eval '.spec.values.tag = env(CIRCLE_SHA1)' -i \
              fluxcd/clusters/production/apps/mediajel-gql-docs/mediajel-gql-docs.yaml
            git add fluxcd/clusters/production/apps/mediajel-gql-docs/mediajel-gql-docs.yaml
          context: PRODUCTION
          filters:
            branches:
              only: master
          requires: [ Build-Graphql-Docs-Production ]